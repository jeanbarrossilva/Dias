[versions]
android-appSearch = '1.1.0'
android-gradle = '9.5.1'
android-room = '2.8.5'
android-sdk-compile-major = '37'
android-sdk-compile-minor = '1'
android-test-espresso = '3.7.0'
java = '21'
kotlin = '2.4.21'

[libraries]
agrona = { group = 'org.agrona', name = 'agrona', version = '2.6.1' }
android-activity-compose = { group = 'androidx.activity', name = 'activity-compose', version = '1.13.0' }
android-appSearch = { group = 'androidx.appsearch', name = 'appsearch', version.ref = 'android-appSearch' }
android-appSearch-compiler = { group = 'androidx.appsearch', name = 'appsearch-compiler', version.ref = 'android-appSearch' }
android-appSearch-localStorage = { group = 'androidx.appsearch', name = 'appsearch-local-storage', version.ref = 'android-appSearch' }
android-collection = { group = 'androidx.collection', name = 'collection', version = '1.7.0' }
android-compose-ui-tooling = { group = 'androidx.compose.ui', name = 'ui-tooling', version = '1.13.0' }
android-compose-material-icons = { group = 'androidx.compose.material', name = 'material-icons-core', version = '1.7.8' }
android-compose-material3 = { group = 'androidx.compose.material3', name = 'material3', version = '1.5.0' }
android-constraintLayout = { group = 'androidx.constraintlayout', name = 'constraintlayout', version = '2.2.2' }
android-material = { group = 'com.google.android.material', name = 'material', version = '1.14.0' }
android-room-compiler = { group = 'androidx.room', name = 'room-compiler', version.ref = 'android-room' }
android-room-runtime = { group = 'androidx.room', name = 'room-runtime', version.ref = 'android-room' }
android-test = { group = 'androidx.test', name = 'core', version = '1.7.0' }
android-test-espresso-core = { group = 'androidx.test.espresso', name = 'espresso-core', version.ref = 'android-test-espresso' }
android-test-espresso-intents = { group = 'androidx.test.espresso', name = 'espresso-intents', version.ref = 'android-test-espresso' }
android-tools-build-gradleApi = { group = 'com.android.tools.build', name = 'gradle-api', version.ref = 'android-gradle' }
apache-lucene = { group = 'org.apache.lucene', name = 'lucene-analysis-common', version = '10.5.2' }
assertJ = { group = 'org.assertj', name = 'assertj-core', version = '3.27.7' }
guava = { group = 'com.google.guava', name = 'guava', version = '33.7.1-android' }
jUnit4 = { group = 'junit', name = 'junit', version = '4.13.2' }
jUnitParams = { group = 'pl.pragmatists', name = 'JUnitParams', version = '1.1.1' }
mockito = { group = 'org.mockito', name = 'mockito-core', version = '5.24.0' }
robolectric = { group = 'org.robolectric', name = 'robolectric', version = '4.16.1' }

[plugins]
android-application = { id = 'com.android.application', version.ref = 'android-gradle' }
android-compose = { id = 'org.jetbrains.kotlin.plugin.compose', version.ref = 'kotlin' }
android-library = { id = 'com.android.library', version.ref = 'android-gradle' }
kotlin-parcelize = { id = 'org.jetbrains.kotlin.plugin.parcelize', version.ref = 'kotlin' }
ksp = { id = 'com.google.devtools.ksp', version = '2.3.10' }